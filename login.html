<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log In — NutriSnap AI</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--primary:#00C896;--secondary:#6C63FF;--dark:#0D0D1A;--card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);--sub:#AAB4C8;}
  body{background:var(--dark);color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
  .bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(108,99,255,0.2),transparent),radial-gradient(ellipse 60% 50% at 80% 80%,rgba(0,200,150,0.15),transparent);}
  .box{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px 32px;width:100%;max-width:380px;}
  .logo{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px;} .logo span{color:var(--primary);}
  .tag{text-align:center;color:var(--sub);font-size:13px;margin-bottom:28px;}
  .mode-toggle{display:flex;background:rgba(255,255,255,0.05);border-radius:10px;padding:3px;margin-bottom:22px;}
  .mode-btn{flex:1;padding:9px;border:none;background:transparent;color:var(--sub);border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;}
  .mode-btn.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
  input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;margin-bottom:12px;outline:none;transition:border-color .2s;}
  input:focus{border-color:var(--primary);}
  input::placeholder{color:var(--sub);}
  button.submit{width:100%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 24px rgba(0,200,150,0.3);transition:transform .2s;}
  button.submit:hover{transform:translateY(-2px);}
  button.submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .err{background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.3);color:#FF6B6B;padding:10px 14px;border-radius:10px;font-size:12px;margin-top:12px;display:none;}
  .ok{background:rgba(0,200,150,0.1);border:1px solid rgba(0,200,150,0.3);color:var(--primary);padding:10px 14px;border-radius:10px;font-size:12px;margin-top:12px;display:none;}
  .back{display:block;text-align:center;color:var(--sub);font-size:13px;margin-top:20px;text-decoration:none;}
  .back:hover{color:var(--primary);}
  .forgot{display:block;text-align:right;color:var(--sub);font-size:12px;margin:-6px 0 14px;text-decoration:none;cursor:pointer;}
  .forgot:hover{color:var(--primary);}
  .divider{display:flex;align-items:center;text-align:center;color:var(--sub);font-size:12px;margin:18px 0;}
  .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid var(--border);}
  .divider span{padding:0 12px;}
  .google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#3c4043;border:1px solid rgba(255,255,255,0.2);padding:12px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .2s;}
  .google-btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="box">
  <div class="logo">🌟 NutriSnap <span>AI</span></div>
  <div class="tag" id="tagline">Log in to continue your journey</div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-login" onclick="setMode('login')">Log In</button>
    <button class="mode-btn" id="mode-signup" onclick="setMode('signup')">Sign Up</button>
  </div>

  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">
  <a class="forgot" id="forgotLink" onclick="sendPasswordReset()">Forgot password?</a>

  <button class="submit" id="submitBtn" onclick="submit()">Log In</button>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>

  <div class="divider"><span>or</span></div>

  <button class="google-btn" onclick="signInWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.11-.28-1.72s.1-1.18.28-1.72V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    Continue with Google
  </button>

  <a class="back" href="index.html">← Back to home</a>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCNNGTM4qvJew9OR5g_x2ZYPgXJyTxRYrY",
    authDomain: "nutrisnap-ai-65f78.firebaseapp.com",
    projectId: "nutrisnap-ai-65f78",
    storageBucket: "nutrisnap-ai-65f78.firebasestorage.app",
    messagingSenderId: "1088022249742",
    appId: "1:1088022249742:web:b2e299dc50cfa20635975f",
    measurementId: "G-7XG2KFWM4N"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let mode = 'login';
  function setMode(m) {
    mode = m;
    document.getElementById('mode-login').classList.toggle('active', m === 'login');
    document.getElementById('mode-signup').classList.toggle('active', m === 'signup');
    document.getElementById('submitBtn').textContent = m === 'login' ? 'Log In' : 'Create Account';
    document.getElementById('tagline').textContent = m === 'login' ? 'Log in to continue your journey' : 'Create your account — free to start';
    document.getElementById('forgotLink').style.display = m === 'login' ? 'block' : 'none';
    document.getElementById('err').style.display = 'none';
    document.getElementById('ok').style.display = 'none';
  }

  // Already logged in? Skip straight to the app.
  auth.onAuthStateChanged(user => { if (user) window.location.href = 'app.html'; });

  async function submit() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('err');
    const btn = document.getElementById('submitBtn');
    errEl.style.display = 'none';
    document.getElementById('ok').style.display = 'none';
    if (!email || !password) { errEl.textContent = 'Enter email and password'; errEl.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Please wait...';
    try {
      if (mode === 'login') {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        await auth.createUserWithEmailAndPassword(email, password);
      }
      window.location.href = 'app.html';
    } catch(e) {
      errEl.textContent = '❌ ' + e.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = mode === 'login' ? 'Log In' : 'Create Account';
    }
  }

  // Uses Firebase's own built-in, secure password reset flow — no custom
  // backend needed. Firebase generates the reset link and emails it directly.
  async function sendPasswordReset() {
    const email = document.getElementById('email').value.trim();
    const errEl = document.getElementById('err');
    const okEl = document.getElementById('ok');
    errEl.style.display = 'none'; okEl.style.display = 'none';
    if (!email) {
      errEl.textContent = 'Enter your email above first, then tap "Forgot password?"';
      errEl.style.display = 'block';
      return;
    }
    try {
      await auth.sendPasswordResetEmail(email);
      okEl.textContent = '✅ Password reset email sent! Check your inbox.';
      okEl.style.display = 'block';
    } catch(e) {
      errEl.textContent = '❌ ' + e.message;
      errEl.style.display = 'block';
    }
  }

  async function signInWithGoogle() {
    const errEl = document.getElementById('err');
    errEl.style.display = 'none';
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithRedirect(provider);
      // Browser navigates away to Google's sign-in page here; result is handled
      // by getRedirectResult() below once the user is sent back.
    } catch(e) {
      errEl.textContent = '❌ ' + e.message;
      errEl.style.display = 'block';
    }
  }

  // Handles the return trip after signInWithRedirect() sends the user to Google and back.
  auth.getRedirectResult().then(result => {
    if (result.user) {
      window.location.href = 'app.html';
    }
  }).catch(e => {
    const errEl = document.getElementById('err');
    errEl.textContent = '❌ ' + e.message;
    errEl.style.display = 'block';
  });

  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
